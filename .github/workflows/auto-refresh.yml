name: Auto refresh monthly report

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          path: chzzk-streamer-pages

      - name: Checkout analyzer repo
        uses: actions/checkout@v4
        with:
          repository: zecheop/chzzk-chat-analyzer
          ssh-key: ${{ secrets.ANALYZER_DEPLOY_KEY }}
          path: chzzk-chat-analyzer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analyzer dependencies
        run: pip install -r chzzk-chat-analyzer/requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name "monthly-zecheon-bot"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Set up deploy keys for pushing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PAGES_DEPLOY_KEY }}" > ~/.ssh/pages_deploy_key
          echo "${{ secrets.ANALYZER_DEPLOY_KEY }}" > ~/.ssh/analyzer_deploy_key
          chmod 600 ~/.ssh/pages_deploy_key ~/.ssh/analyzer_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          # actions/checkout persists an HTTPS+GITHUB_TOKEN credential by default even
          # when ssh-key is given, which makes commits from this job invisible to other
          # triggers (GITHUB_TOKEN pushes don't fire other workflows). Force both repo
          # checkouts onto their deploy-key-authenticated SSH remotes explicitly so the
          # later pushes are real, workflow-triggering pushes.
          git -C chzzk-streamer-pages remote set-url origin git@github.com:zecheop/monthly_zecheon.git
          git -C chzzk-chat-analyzer remote set-url origin git@github.com:zecheop/chzzk-chat-analyzer.git

      - name: Run refresh pipeline
        working-directory: chzzk-streamer-pages
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/pages_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: python scripts/refresh_monthly_pipeline.py

      - name: Push analyzer log changes
        working-directory: chzzk-chat-analyzer
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/analyzer_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: |
          if [ -n "$(git status --porcelain analysis_logs)" ]; then
            git add analysis_logs
            git commit --amend --no-edit
            git push --force origin HEAD:main
          fi
